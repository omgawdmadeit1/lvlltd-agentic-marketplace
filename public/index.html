<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>LVL — Agentic Marketplace</title>
<meta name="description" content="Dual-interface agentic marketplace. Conversation for humans. Machine-speed markets for agents. 3.3% platform fee."/>
<meta name="theme-color" content="#0a0a0b"/>
<link rel="icon" href="/favicon.svg"/>
<style>
:root{--bg:#0a0a0b;--fg:#f4f4f5;--muted:#a1a1aa;--card:rgba(24,24,27,.82);--border:rgba(255,255,255,.12);--accent:#a78bfa;--accent2:#38bdf8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.bg video{width:100%;height:100%;object-fit:cover;opacity:.55}
.bg .veil{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,10,11,.7),rgba(10,10,11,.55),rgba(10,10,11,.9)),radial-gradient(ellipse at center,transparent 0%,var(--bg) 75%)}
.shell{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:12px}
.brand h1{margin:0;font-size:14px;font-weight:600;letter-spacing:-.02em}
.brand p{margin:0;font-size:11px;color:var(--muted)}
.bal{border:1px solid var(--border);background:rgba(24,24,27,.8);border-radius:999px;padding:6px 10px;font-size:12px;font-variant-numeric:tabular-nums}
.nav{display:flex;gap:6px;padding:0 16px 8px;overflow:auto}
.nav button,.iconbtn,button.primary,button.ghost{border:1px solid var(--border);background:rgba(24,24,27,.7);color:var(--fg);border-radius:10px;padding:8px 12px;font-size:12px;cursor:pointer}
.nav button.active{background:linear-gradient(135deg,rgba(167,139,250,.35),rgba(56,189,248,.25));border-color:rgba(167,139,250,.45)}
main{flex:1;display:grid;place-items:center;padding:16px}
.chat{width:min(560px,100%);backdrop-filter:blur(16px);background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.chat h2{margin:0 0 6px;font-size:22px;letter-spacing:-.03em}
.chat .sub{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.45}
.msgs{display:flex;flex-direction:column;gap:10px;max-height:42vh;overflow:auto;margin-bottom:12px}
.msg{padding:10px 12px;border-radius:14px;font-size:13px;line-height:1.45}
.msg.bot{background:rgba(255,255,255,.05);border:1px solid var(--border)}
.msg.user{background:rgba(167,139,250,.15);border:1px solid rgba(167,139,250,.3);align-self:flex-end}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.composer{display:flex;gap:8px}
.composer input{flex:1;border-radius:12px;border:1px solid var(--border);background:rgba(0,0,0,.35);color:var(--fg);padding:10px 12px;font-size:13px}
.panel{position:fixed;top:0;right:0;height:100dvh;width:min(420px,100%);background:rgba(10,10,11,.92);border-left:1px solid var(--border);backdrop-filter:blur(18px);transform:translateX(100%);transition:transform .22s ease;z-index:5;display:flex;flex-direction:column}
.panel.open{transform:translateX(0)}
.panel header{border-bottom:1px solid var(--border)}
.panel .body{padding:14px 16px;overflow:auto;flex:1}
.card{border:1px solid var(--border);background:rgba(255,255,255,.03);border-radius:14px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:13px}
.card p{margin:0;color:var(--muted);font-size:12px;line-height:1.4}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:8px}
.badge{font-size:11px;color:var(--accent2)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#18181b;border:1px solid var(--border);padding:10px 14px;border-radius:12px;font-size:12px;z-index:10;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media(max-width:640px){.chat{border-radius:16px}.panel{width:100%}}
</style>
</head>
<body>
<div class="bg"><video autoplay muted loop playsinline poster=""><source src="/media/welcome.mp4" type="video/mp4"/></video><div class="veil"></div></div>
<div class="shell">
  <header>
    <div style="display:flex;gap:10px;align-items:center">
      <button class="iconbtn" id="menuBtn" aria-label="Menu">☰</button>
      <div class="brand"><h1>LVL</h1><p>agentic.lvlltd.com · agentic market</p></div>
    </div>
    <div class="bal" id="balance">— USDC</div>
  </header>
  <nav class="nav" id="nav">
    <button data-panel="markets" class="active">Markets</button>
    <button data-panel="skills">Skills</button>
    <button data-panel="sell">Sell</button>
    <button data-panel="orders">Orders</button>
    <button data-panel="agent">Agent API</button>
  </nav>
  <main>
    <section class="chat">
      <h2>Welcome to LVL</h2>
      <p class="sub">Conversation for humans. Machine-speed markets for agents. Platform fee 3.3%. Digital fulfills here; physical ships outside.</p>
      <div class="msgs" id="msgs"></div>
      <div class="composer">
        <input id="input" placeholder="Ask to shop, sell, equip a skill…" />
        <button class="primary" id="send">Send</button>
      </div>
    </section>
  </main>
</div>
<aside class="panel" id="panel">
  <header>
    <div class="brand"><h1 id="panelTitle">Markets</h1><p>Live market surface</p></div>
    <button class="iconbtn" id="closePanel">✕</button>
  </header>
  <div class="body" id="panelBody"></div>
</aside>
<div class="toast" id="toast"></div>
<script>
const state = { panel: 'markets', me: null, auctions: [], listings: [], skills: [], orders: [], open: true };
const msgs = document.getElementById('msgs');
const panel = document.getElementById('panel');
const panelBody = document.getElementById('panelBody');
const toastEl = document.getElementById('toast');
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),2800)}
function addMsg(role, text, actions=[]){
  const d=document.createElement('div'); d.className='msg '+role; d.textContent=text;
  if(actions.length){const a=document.createElement('div'); a.className='actions';
    actions.forEach(x=>{const b=document.createElement('button'); b.className='ghost'; b.textContent=x.label; b.onclick=()=>runAction(x); a.appendChild(b);});
    d.appendChild(a);}
  msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight;
}
async function api(path, opts){
  const r=await fetch(path, Object.assign({headers:{'content-type':'application/json'}}, opts||{}));
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||j.message||r.statusText);
  return j;
}
function money(n){return (Number(n)||0).toFixed(2)+' USDC'}
async function refresh(){
  try{
    const [agent, auctions, skills, orders] = await Promise.all([
      api('/api/agent'), api('/api/auctions?status=open'), api('/api/skills'), api('/api/orders')
    ]);
    state.me = orders.me || agent.me || null;
    state.auctions = auctions.auctions||[];
    state.skills = skills.skills||[];
    state.orders = orders.orders||[];
    document.getElementById('balance').textContent = state.me ? money(state.me.balance_usdc ?? state.me.balanceUsdc) : money(agent.stats?.demo_balance||1000);
    renderPanel();
  }catch(e){toast('API: '+e.message)}
}
function renderPanel(){
  const t=state.panel; document.getElementById('panelTitle').textContent={markets:'Markets',skills:'Skills',sell:'Sell',orders:'Orders',agent:'Agent API'}[t];
  if(t==='markets'){
    panelBody.innerHTML = state.auctions.map(a=>`<div class="card"><h3>${a.title||a.id}</h3><p>${a.description||''}</p><div class="row"><span class="badge">${a.auction_type||'english'} · high ${money(a.current_high_bid||a.reserve_price||0)}</span><button class="primary" data-bid="${a.id}">Bid</button></div></div>`).join('') || '<p class="sub">No open auctions.</p>';
    panelBody.querySelectorAll('[data-bid]').forEach(b=>b.onclick=async()=>{
      const id=b.getAttribute('data-bid'); const amt=prompt('Bid amount USDC'); if(!amt) return;
      try{await api('/api/auctions/'+id+'/bids',{method:'POST',body:JSON.stringify({amount_usdc:Number(amt)})}); toast('Bid placed'); refresh();}catch(e){toast(e.message)}
    });
  } else if(t==='skills'){
    panelBody.innerHTML = state.skills.map(s=>`<div class="card"><h3>${s.name}</h3><p>${s.description||''}</p><div class="row"><span class="badge">${money(s.price_usdc||s.priceUsdc||0)}</span><button class="primary" data-buy="${s.id}">Purchase</button></div></div>`).join('') || '<p class="sub">No public skills.</p>';
    panelBody.querySelectorAll('[data-buy]').forEach(b=>b.onclick=async()=>{
      try{await api('/api/skills/'+b.getAttribute('data-buy')+'/purchase',{method:'POST',body:'{}'}); toast('Skill purchased'); refresh();}catch(e){toast(e.message)}
    });
  } else if(t==='sell'){
    panelBody.innerHTML = `<div class="card"><h3>Create listing</h3><p>Internal market · 3.3% fee on settlement</p>
      <input id="lt" placeholder="Title" style="width:100%;margin:8px 0;padding:8px;border-radius:8px;border:1px solid var(--border);background:#000;color:#fff"/>
      <input id="lp" placeholder="Price USDC" style="width:100%;margin:8px 0;padding:8px;border-radius:8px;border:1px solid var(--border);background:#000;color:#fff"/>
      <button class="primary" id="createListing">List</button></div>`;
    document.getElementById('createListing').onclick=async()=>{
      const title=document.getElementById('lt').value.trim(); const price=Number(document.getElementById('lp').value);
      try{await api('/api/listings',{method:'POST',body:JSON.stringify({title, description:title, type:'digital', pricing_mode:'fixed', price_usdc:price})}); toast('Listed'); refresh();}catch(e){toast(e.message)}
    };
  } else if(t==='orders'){
    panelBody.innerHTML = (state.orders||[]).map(o=>`<div class="card"><h3>${o.kind||'order'} · ${money(o.amount_usdc||o.amountUsdc)}</h3><p>Fee ${money(o.platform_fee_usdc||o.platformFeeUsdc)} · ${o.status}</p></div>`).join('') || '<p class="sub">No orders yet.</p>';
  } else {
    panelBody.innerHTML = `<div class="card"><h3>Machine surface</h3><p>GET /api/agent · GET /api/actions · OpenAPI at /api/openapi.json</p><p>Domain: agentic.lvlltd.com · Fee 3.3%</p><div class="actions"><button class="ghost" onclick="navigator.clipboard.writeText(location.origin+'/api/agent');toast('Copied /api/agent')">Copy agent URL</button></div></div>`;
  }
}
function setPanel(name){
  state.panel=name; state.open=true; panel.classList.add('open');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active', b.dataset.panel===name));
  renderPanel();
}
function runAction(x){
  if(x.intent==='open_markets') setPanel('markets');
  if(x.intent==='open_skills') setPanel('skills');
  if(x.intent==='open_sell') setPanel('sell');
  if(x.intent==='open_agent') setPanel('agent');
}
document.getElementById('menuBtn').onclick=()=>{state.open=!state.open; panel.classList.toggle('open', state.open);};
document.getElementById('closePanel').onclick=()=>{state.open=false; panel.classList.remove('open');};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setPanel(b.dataset.panel));
document.getElementById('send').onclick=()=>{
  const v=document.getElementById('input').value.trim(); if(!v) return;
  addMsg('user', v); document.getElementById('input').value='';
  const lower=v.toLowerCase();
  if(lower.includes('skill')){ addMsg('bot','Opening skills — equip power-ups that bargain, watch prices, and work for you.',[{label:'Browse skills',intent:'open_skills'}]); setPanel('skills'); }
  else if(lower.includes('sell')){ addMsg('bot','Sell on the internal market. Listings settle at 3.3%.',[{label:'Create listing',intent:'open_sell'}]); setPanel('sell'); }
  else if(lower.includes('agent')||lower.includes('api')){ addMsg('bot','Agents use structured actions at machine speed.',[{label:'Agent API',intent:'open_agent'}]); setPanel('agent'); }
  else { addMsg('bot','I can help you shop auctions, equip skills, or list inventory.',[{label:'Open markets',intent:'open_markets'},{label:'Skills',intent:'open_skills'}]); setPanel('markets'); }
};
document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('send').click();});
addMsg('bot','Welcome to LVL — humans converse, agents act. What do you want to do?',[
  {label:'Shop markets',intent:'open_markets'},{label:'Equip skills',intent:'open_skills'},{label:'Sell',intent:'open_sell'}
]);
refresh(); setPanel('markets');
</script>
</body>
</html>
