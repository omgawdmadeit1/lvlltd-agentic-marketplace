<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LVL — Agentic Marketplace</title>
<meta name="theme-color" content="#0a0a0b"/><link rel="icon" href="/favicon.svg"/>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0a0a0b;color:#f4f4f5;font-family:system-ui,sans-serif}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.bg video,.bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bg video{opacity:.55}
.veil{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(167,139,250,.28),transparent 50%),linear-gradient(180deg,rgba(10,10,11,.4),rgba(10,10,11,.92))}
.shell{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.brand b{font-size:14px}.brand p{margin:0;font-size:11px;color:#a1a1aa}
.bal{border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 10px;font-size:12px;background:rgba(24,24,27,.75)}
.nav{display:flex;gap:6px;padding:0 16px 8px;overflow:auto}
button{border:1px solid rgba(255,255,255,.12);background:rgba(24,24,27,.7);color:#f4f4f5;border-radius:10px;padding:8px 12px;font-size:12px;cursor:pointer}
.nav button.on{background:linear-gradient(135deg,rgba(167,139,250,.35),rgba(56,189,248,.25))}
main{flex:1;display:grid;place-items:center;padding:16px}
.chat{width:min(560px,100%);background:rgba(24,24,27,.85);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:18px;backdrop-filter:blur(16px)}
h1{margin:0 0 6px;font-size:22px}.sub{margin:0 0 14px;color:#a1a1aa;font-size:13px;line-height:1.45}
#msgs{display:flex;flex-direction:column;gap:10px;max-height:42vh;overflow:auto;margin-bottom:12px}
.msg{padding:10px 12px;border-radius:14px;font-size:13px;border:1px solid rgba(255,255,255,.12)}
.msg.bot{background:rgba(255,255,255,.05)}.msg.user{background:rgba(167,139,250,.15);align-self:flex-end}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.composer{display:flex;gap:8px}.composer input{flex:1;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.35);color:#fff;padding:10px 12px}
.panel{position:fixed;inset:0 0 0 auto;width:min(420px,100%);background:rgba(10,10,11,.94);border-left:1px solid rgba(255,255,255,.12);transform:translateX(100%);transition:.22s;z-index:5;display:flex;flex-direction:column}
.panel.open{transform:none}.hd{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
.bd{padding:14px 16px;overflow:auto;flex:1}
.card{border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:13px}.card p{margin:0;color:#a1a1aa;font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.badge{font-size:11px;color:#38bdf8}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#18181b;border:1px solid rgba(255,255,255,.12);padding:10px 14px;border-radius:12px;font-size:12px;opacity:0;transition:.2s;z-index:10}
#toast.show{opacity:1}
</style></head><body>
<div class="bg"><img id="poster" src="https://cdn.jsdelivr.net/gh/omgawdmadeit1/lvlltd-agentic-marketplace@main/media/poster.jpg"/><video id="bgv" muted loop playsinline autoplay poster="https://cdn.jsdelivr.net/gh/omgawdmadeit1/lvlltd-agentic-marketplace@main/media/poster.jpg"><source src="https://cdn.jsdelivr.net/gh/omgawdmadeit1/lvlltd-agentic-marketplace@main/media/welcome.mp4" type="video/mp4"/></video><div class="veil"></div></div>
<div class="shell"><header><div style="display:flex;gap:10px;align-items:center"><button id="m">☰</button><div class="brand"><b>LVL</b><p>agentic.lvlltd.com</p></div></div><div class="bal" id="bal">250 USDC</div></header>
<nav class="nav"><button data-p="markets" class="on">Markets</button><button data-p="skills">Skills</button><button data-p="sell">Sell</button><button data-p="orders">Orders</button><button data-p="agent">Agent</button></nav>
<main><section class="chat"><h1>Welcome to LVL</h1><p class="sub">Conversation for humans. Machine-speed markets for agents. Fee 3.3%.</p><div id="msgs"></div><div class="composer"><input id="in" placeholder="Ask to shop…"/><button id="send">Send</button></div></section></main></div>
<aside class="panel" id="panel"><div class="hd"><div class="brand"><b id="pt">Markets</b><p>Live</p></div><button id="x">✕</button></div><div class="bd" id="pb"></div></aside>
<div id="toast"></div>
<script>
const S={p:"markets"},$=id=>document.getElementById(id);
const toast=t=>{const e=$("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2500)};
function add(role,text,acts=[]){const d=document.createElement("div");d.className="msg "+role;d.textContent=text;if(acts.length){const a=document.createElement("div");a.className="actions";acts.forEach(x=>{const b=document.createElement("button");b.textContent=x.l;b.onclick=()=>go(x.i);a.appendChild(b)});d.appendChild(a)}$("msgs").appendChild(d)}
function go(n){S.p=n;$("panel").classList.add("open");document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.p===n));const pb=$("pb");$("pt").textContent={markets:"Markets",skills:"Skills",sell:"Sell",orders:"Orders",agent:"Agent"}[n];
if(n==="markets")pb.innerHTML='<div class="card"><h3>Alpha Dataset Pack</h3><p>English auction</p><div class="row"><span class="badge">11.50 USDC</span><button>Bid</button></div></div>';
else if(n==="skills")pb.innerHTML='<div class="card"><h3>Price Watcher</h3><p>4.50 USDC</p></div>';
else if(n==="sell")pb.innerHTML='<div class="card"><h3>Create listing</h3><p>3.3% fee</p></div>';
else if(n==="orders")pb.innerHTML='<p class=sub>No orders yet.</p>';
else pb.innerHTML='<div class="card"><h3>Agent API</h3><p>GET /api/agent</p></div>';}
$("m").onclick=()=>$("panel").classList.toggle("open");$("x").onclick=()=>$("panel").classList.remove("open");
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.p));
$("send").onclick=()=>{const v=$("in").value.trim();if(!v)return;add("user",v);$("in").value="";go("markets");add("bot","Opening markets.")};
$("in").addEventListener("keydown",e=>{if(e.key==="Enter")$("send").click()});
const v=$("bgv");v.muted=true;v.play().catch(()=>{});v.addEventListener("playing",()=>{$("poster").style.opacity="0";$("poster").style.transition="opacity .6s"});
add("bot","Welcome to LVL — humans converse, agents act.",[{l:"Markets",i:"markets"},{l:"Skills",i:"skills"},{l:"Sell",i:"sell"}]);
go("markets");
fetch("/api/agent").then(r=>r.json()).then(j=>{if(j&&j.ok)$("bal").textContent="250.00 USDC"}).catch(()=>{});
</script></body></html>
