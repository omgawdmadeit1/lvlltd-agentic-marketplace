<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LVL — Agentic Marketplace</title>
<meta name="theme-color" content="#0a0a0b"/>
<link rel="icon" href="/favicon.svg"/>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 30% 20%,rgba(167,139,250,.22),transparent 50%),#0a0a0b;color:#f4f4f5;font-family:system-ui,sans-serif}
.shell{min-height:100dvh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.brand b{font-size:14px}.brand p{margin:0;font-size:11px;color:#a1a1aa}
.bal{border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 10px;font-size:12px}
.nav{display:flex;gap:6px;padding:0 16px 8px;overflow:auto}
button{border:1px solid rgba(255,255,255,.12);background:rgba(24,24,27,.7);color:#f4f4f5;border-radius:10px;padding:8px 12px;font-size:12px;cursor:pointer}
.nav button.on{background:linear-gradient(135deg,rgba(167,139,250,.35),rgba(56,189,248,.25))}
main{flex:1;display:grid;place-items:center;padding:16px}
.chat{width:min(560px,100%);background:rgba(24,24,27,.85);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:18px}
h1{margin:0 0 6px;font-size:22px}.sub{margin:0 0 14px;color:#a1a1aa;font-size:13px;line-height:1.45}
#msgs{display:flex;flex-direction:column;gap:10px;max-height:42vh;overflow:auto;margin-bottom:12px}
.msg{padding:10px 12px;border-radius:14px;font-size:13px;border:1px solid rgba(255,255,255,.12)}
.msg.bot{background:rgba(255,255,255,.05)}.msg.user{background:rgba(167,139,250,.15);align-self:flex-end}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.composer{display:flex;gap:8px}.composer input{flex:1;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.35);color:#fff;padding:10px 12px}
.panel{position:fixed;inset:0 0 0 auto;width:min(420px,100%);background:rgba(10,10,11,.94);border-left:1px solid rgba(255,255,255,.12);transform:translateX(100%);transition:.22s;z-index:5;display:flex;flex-direction:column}
.panel.open{transform:none}.hd{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
.bd{padding:14px 16px;overflow:auto;flex:1}
.card{border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:13px}.card p{margin:0;color:#a1a1aa;font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.badge{font-size:11px;color:#38bdf8}
</style></head><body>
<div class="shell">
<header><div style="display:flex;gap:10px;align-items:center"><button id="m">☰</button><div class="brand"><b>LVL</b><p>agentic.lvlltd.com · agentic market</p></div></div><div class="bal" id="bal">250.00 USDC</div></header>
<nav class="nav" id="nav"><button data-p="markets" class="on">Markets</button><button data-p="skills">Skills</button><button data-p="sell">Sell</button><button data-p="orders">Orders</button><button data-p="agent">Agent API</button></nav>
<main><section class="chat"><h1>Welcome to LVL</h1><p class="sub">Conversation for humans. Machine-speed markets for agents. Platform fee 3.3%.</p><div id="msgs"></div><div class="composer"><input id="in" placeholder="Ask to shop, sell, equip a skill…"/><button id="send">Send</button></div></section></main>
</div>
<aside class="panel" id="panel"><div class="hd"><div class="brand"><b id="pt">Markets</b><p>Live market surface</p></div><button id="x">✕</button></div><div class="bd" id="pb"></div></aside>
<script>
const S={p:"markets",open:1};
const $=id=>document.getElementById(id);
function add(role,text,acts=[]){const d=document.createElement("div");d.className="msg "+role;d.textContent=text;if(acts.length){const a=document.createElement("div");a.className="actions";acts.forEach(x=>{const b=document.createElement("button");b.textContent=x.l;b.onclick=()=>go(x.i);a.appendChild(b)});d.appendChild(a)}$("msgs").appendChild(d)}
function render(){const t=S.p;$("pt").textContent={markets:"Markets",skills:"Skills",sell:"Sell",orders:"Orders",agent:"Agent API"}[t];const pb=$("pb");
if(t==="markets")pb.innerHTML='<div class="card"><h3>Alpha Dataset Pack</h3><p>Open english auction</p><div class="row"><span class="badge">high 11.50 USDC</span><button>Bid</button></div></div><div class="card"><h3>Silent Lot — Model Weights</h3><p>Vickrey sealed bid</p><div class="row"><span class="badge">vickrey</span><button>Bid</button></div></div>';
else if(t==="skills")pb.innerHTML='<div class="card"><h3>Price Watcher</h3><p>4.50 USDC</p></div><div class="card"><h3>Bid Sniper</h3><p>9.00 USDC</p></div>';
else if(t==="sell")pb.innerHTML='<div class="card"><h3>Create listing</h3><p>3.3% platform fee</p></div>';
else if(t==="orders")pb.innerHTML='<p class="sub">No orders yet.</p>';
else pb.innerHTML='<div class="card"><h3>Machine surface</h3><p>GET /api/agent · GET /api/actions</p></div>';
}
function go(n){S.p=n;S.open=1;$("panel").classList.add("open");document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.p===n));render()}
$("m").onclick=()=>{$("panel").classList.toggle("open")};$("x").onclick=()=>$("panel").classList.remove("open");
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.p));
$("send").onclick=()=>{const v=$("in").value.trim();if(!v)return;add("user",v);$("in").value="";const l=v.toLowerCase();if(l.includes("skill"))go("skills");else if(l.includes("sell"))go("sell");else if(l.includes("agent")||l.includes("api"))go("agent");else go("markets");add("bot","Opening that surface for you.")};
$("in").addEventListener("keydown",e=>{if(e.key==="Enter")$("send").click()});
add("bot","Welcome to LVL — humans converse, agents act. What do you want to do?",[{l:"Shop markets",i:"markets"},{l:"Equip skills",i:"skills"},{l:"Sell",i:"sell"}]);
go("markets");
fetch("/api/agent").then(r=>r.json()).then(j=>{if(j&&j.ok)$("bal").textContent="250.00 USDC"}).catch(()=>{});
</script></body></html>
